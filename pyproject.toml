[project]
name = "podplex"
version = "0.1.0"
description = "Sync a Plex music library to a Rockbox-modded iPod on Linux"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "plexapi>=4.15",
    "requests>=2.31",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "rapidfuzz>=3.5",
]

[project.scripts]
podplex = "podplex.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podplex"]

[dependency-groups]
dev = ["pytest>=8.0"]
